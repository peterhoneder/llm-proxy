name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A weekly sweep. The scan below already covers the whole history on every
  # push, so this exists for one reason: gitleaks ships new rules, and a key
  # that was invisible to last month's ruleset is worth catching this month.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # fmt + vet + lint + the full suite under -race.
      - run: make check

  secrets:
    runs-on: ubuntu-latest
    env:
      # Pinned and checksummed. An unpinned scanner is a supply-chain hole in
      # the one job whose purpose is supply-chain hygiene.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks walks real history; the default shallow clone gives it one
          # commit and nothing to walk.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # The same command the pre-commit hook runs, over the whole history.
      # Deliberately not gitleaks-action: it derives a commit range from the
      # push payload and asks git for <first-pushed-commit>^, which does not
      # exist when the range starts at the root commit. git fails, gitleaks
      # exits 1, and the action reports "Unexpected exit code [1]" — a tooling
      # error dressed up as a security finding. A full scan has no such edge.
      - run: make secrets
